services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: operator_test
      POSTGRES_USER: operator_test
      POSTGRES_PASSWORD: operator_test
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operator_test -d operator_test"]
      interval: 1s
      timeout: 3s
      retries: 30
