services:
  engine:
    build: ./engine
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      PORT: "4000"
      OPERATOR_URL: http://operator:3000
      OPERATOR_KEY: ${ENGINE_OPERATOR_KEY:-dev-operator-key}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DROP_WS_EVERY: ${DROP_WS_EVERY:-0}
      REORDER: ${REORDER:-0}
      DUPLICATE_WEBHOOKS: ${DUPLICATE_WEBHOOKS:-0}
      CASHOUT_TIMEOUT: ${CASHOUT_TIMEOUT:-0}
      CLOCK_SKEW: ${CLOCK_SKEW:-0}

  operator-migrate:
    build: ./operator
    command: ["bun", "run", "src/migrate.ts"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://operator:operator@postgres:5432/operator
    # Same reason as the operator service: pending migrations are applied from
    # the working tree instead of requiring an image rebuild.
    volumes:
      - ./operator/src:/app/src
      - ./operator/drizzle:/app/drizzle
      - ./operator/tsconfig.json:/app/tsconfig.json
    depends_on:
      postgres:
        condition: service_healthy

  operator:
    build: ./operator
    # Bun watches the mounted sources and restarts the service on change, so
    # local development does not need an image rebuild. Dependencies still live
    # in the image: changing package.json needs `docker compose build operator`.
    command: ["bun", "run", "--watch", "src/server.ts"]
    ports:
      # Keep the local operator surface on loopback; production exposure is configured separately.
      - "127.0.0.1:3000:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENGINE_HTTP_URL: http://engine:4000
      ENGINE_STREAM_URL: ws://engine:4000/stream
      ENGINE_OPERATOR_KEY: ${ENGINE_OPERATOR_KEY:-dev-operator-key}
      ENGINE_WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret}
      DATABASE_URL: postgres://operator:operator@postgres:5432/operator
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-86400}
      APP_ENV: local
      WALLET_TEST_TOPUP_ENABLED: "true"
      PAYOUT_MOCK_ENABLED: "true"
    volumes:
      - ./operator/src:/app/src
      - ./operator/drizzle:/app/drizzle
      - ./operator/tsconfig.json:/app/tsconfig.json
    depends_on:
      engine:
        condition: service_started
      operator-migrate:
        condition: service_completed_successfully

  # Local player client for the Crashsim operator. Player auth now exists, but
  # this surface stays a local-only UI, so the host binding remains on loopback.
  client:
    build: ./client
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      OPERATOR_URL: http://operator:3000
    # Vite serves straight from the mounted sources, so UI changes are live
    # without rebuilding the image (HMR inside the container; reload the page
    # if the file watcher does not pick a change up). Dependencies stay in the
    # image: changing package.json still needs `docker compose build client`.
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
      - ./client/index.html:/app/index.html
      - ./client/vite.config.ts:/app/vite.config.ts
      - ./client/tsconfig.json:/app/tsconfig.json
    depends_on:
      - operator

  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: operator
      POSTGRES_PASSWORD: operator
      POSTGRES_DB: operator
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operator -d operator"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
