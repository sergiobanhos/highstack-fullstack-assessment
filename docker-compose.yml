services:
  engine:
    build: ./engine
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      OPERATOR_URL: ${OPERATOR_URL:-http://host.docker.internal:3000}
      OPERATOR_KEY: dev-operator-key
      WEBHOOK_SECRET: dev-webhook-secret
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DROP_WS_EVERY: ${DROP_WS_EVERY:-0}
      REORDER: ${REORDER:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  operator:
    build: ./operator
    ports:
      # Loopback-only: the debug/operator surface is not public until player auth exists.
      - "127.0.0.1:3000:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENGINE_HTTP_URL: http://engine:4000
      ENGINE_STREAM_URL: ws://engine:4000/stream
      ENGINE_OPERATOR_KEY: dev-operator-key
    depends_on:
      - engine

  # Local-only diagnostic page for the Crashsim operator stream. No player
  # auth exists yet, so the host binding stays on loopback.
  client:
    build: ./client
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      OPERATOR_URL: http://operator:3000
    depends_on:
      - operator

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: operator
      POSTGRES_PASSWORD: operator
      POSTGRES_DB: operator
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operator -d operator"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
